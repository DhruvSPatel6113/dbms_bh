name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library_test?schema=public
      JWT_SECRET: ci-test-secret-key-32-chars-long-strictly
      GATE_MIN_TESTS: 150
      GATE_MAX_FLAKY: 0
      GATE_MAX_ATTEMPTS: 3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Dependencies
        run: cd server && npm ci

      - name: Deploy Prisma Migrations (DDL, Triggers, Procedures, Views)
        run: cd server && npx prisma migrate deploy

      - name: Run Strict TDD Gate
        run: cd server && npm run test:gate

